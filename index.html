    :root {
      --bg-main: #070D1E;
      --bg-header: #0B132B;
      --bg-card: #0E172F;
      --bg-inner: #090E1F;
      --border-color: #1E2C52;
      --text-main: #F1F5F9;
      --text-muted: #94A3B8;
    }
    body.theme-light {
      --bg-main: #F8FAFC;
      --bg-header: #FFFFFF;
      --bg-card: #FFFFFF;
      --bg-inner: #F1F5F9;
      --border-color: #E2E8F0;
      --text-main: #0F172A;
      --text-muted: #64748B;
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    .tcc-header { background-color: var(--bg-header); border-color: var(--border-color); }
    .tcc-card { background-color: var(--bg-card); border-color: var(--border-color); }
    .tcc-inner { background-color: var(--bg-inner); border-color: var(--border-color); }
    .hero-gradient {
      background: linear-gradient(135deg, #00A3FF 0%, #0066FF 60%, #5B21B6 100%);
    }
    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: var(--bg-inner); }
    .custom-scroll::-webkit-scrollbar-thumb { background: #2A3B66; border-radius: 6px; }
  </style>
</head>

    function parseYouTubeUrl(url) {
      if (!url) return null;
      if (url.includes('list=')) {
        const m = url.match(/[?&]list=([^&]+)/);
        if (m) return `https://www.youtube.com/embed/videoseries?list=${m[1]}&autoplay=1`;
      }
      const match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/))([a-zA-Z0-9_-]{11})/);
      if (match && match[1]) {
        return `https://www.youtube.com/embed/${match[1]}?autoplay=1&enablejsapi=1`;
      }
      return null;
    }

      activePlayerSource = src;
      const btnYt = document.getElementById('btn-src-yt');

      const frame = document.getElementById('music-iframe');
      if (!frame) return;

      if (src === 'youtube') {
        if (btnYt) btnYt.className = 'py-1.5 rounded-lg bg-sky-500 text-white shadow-xs text-center transition';
        if (btnSp) btnSp.className = 'py-1.5 rounded-lg text-slate-400 hover:text-white transition text-center';
        frame.src = 'https://www.youtube.com/embed/jfKfPfyJRdk?autoplay=1';

        if (btnYt) btnYt.className = 'py-1.5 rounded-lg text-slate-400 hover:text-white transition text-center';

    }

    function updateMusicTrack() {
      const input = document.getElementById('music-url-input')?.value.trim();
      const frame = document.getElementById('music-iframe');
      if (!input || !frame) return;

      if (input.includes('spotify.com')) {
        let embedUrl = input;
        if (!input.includes('/embed/')) {
          embedUrl = input.replace('spotify.com/', 'spotify.com/embed/');
        }
        frame.src = embedUrl;
        switchMusicSource('spotify');
      } else {
        const ytEmbed = parseYouTubeUrl(input);
        if (ytEmbed) {
          frame.src = ytEmbed;
          switchMusicSource('youtube');
        } else {
          alert('Format tautan tidak dikenali. Masukkan URL video/playlist YouTube atau Spotify yang valid.');
        }
      }
    }

    // Auto-detect Model Aktif & Chat Engine
   async function handleSendDashboardAi(e) {
      e.preventDefault();
      const input = document.getElementById('ai-dashboard-input');
      const text = input?.value.trim();
      if (!text) return;

      const container = document.getElementById('ai-dashboard-messages');
      if (!container) return;

      // 1. Tampilkan bubble chat user
      container.innerHTML += `
        <div class="bg-sky-600 text-white p-2.5 rounded-2xl rounded-tr-xs max-w-[85%] ml-auto text-xs shadow-xs">
          ${text}
        </div>
      `;
      input.value = '';
      container.scrollTop = container.scrollHeight;

      // 2. Ambil API Key aktif
      const activeKey = DB.groqApiKey || 
                        localStorage.getItem('TCC_SAFE_FINAL_GROQ_KEY')?.replace(/"/g, '') ||
                        "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";

      if (!activeKey || !activeKey.startsWith("gsk_")) {
        container.innerHTML += `
          <div class="bg-rose-500/20 text-rose-400 p-2.5 rounded-2xl rounded-tl-xs border border-rose-500/30 text-xs">
            Groq API Key belum valid. Klik tombol gear di atas untuk mengisi API Key ya!
          </div>
        `;
        container.scrollTop = container.scrollHeight;
        return;
      }

      container.innerHTML += `<div id="ai-loading-dash" class="text-slate-400 italic text-[11px]">Ta'lim Assistant JosJis lagi mikir bentar ya Bro... ⚡</div>`;
      container.scrollTop = container.scrollHeight;

      const systemPrompt = `Kamu adalah Ta'lim Assistant JosJis: AI Assistant Gaul, Cerdas & Gesit untuk Bagian Pengajaran (Ta'lim) Pondok Pesantren Modern ZIIS Cilongok.
Gaya bicaramu akrab, asik ("Bro", "Gue-Lu", santun tapi energik), sangat paham tugas Ta'lim.
Kamu menguasai data 390 santri mukim Pernasidi Putra (kamar Abdul Aziz 201-206, 102-108, Syanggit 101-105, Gurfah A-L, dan JMK).
Petugas aktif: ${currentGlobalOfficer}. Total santri: ${DB.students.length}.
Bantu petugas mengecek nama santri, draf surat resmi ke 7 bagian organisasi ZIIS, serta penanganan disiplin berbobot (Ringan, Sedang, Berat).`;

      // HANYA gunakan model khusus chat/teks (BUKAN whisper/audio)
      const chatModels = [
        'llama-3.1-8b-instant',
        'gemma2-9b-it'
      ];

      let replyText = null;
      let lastError = "";

      for (const modelName of chatModels) {
        try {
          const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${activeKey.trim()}`
            },
            body: JSON.stringify({
              model: modelName,
              messages: [
                { role: 'system', content: systemPrompt },
                { role: 'user', content: text }
              ],
              temperature: 0.7,
              max_tokens: 600
            })
          });

          if (res.ok) {
            const data = await res.json();
            replyText = data.choices[0]?.message?.content;
            if (replyText) break; // Berhasil, keluar dari loop
          } else {
            const errJson = await res.json().catch(() => ({}));
            lastError = errJson.error?.message || `HTTP ${res.status}`;
          }
        } catch (err) {
          lastError = err.message || "Gagal terkoneksi";
        }
      }

      document.getElementById('ai-loading-dash')?.remove();

      if (replyText) {
        container.innerHTML += `
          <div class="tcc-inner p-2.5 rounded-2xl rounded-tl-xs border text-xs whitespace-pre-line leading-relaxed text-slate-800 dark:text-slate-200">
            ${replyText}
          </div>
        `;
      } else {
        container.innerHTML += `
          <div class="bg-rose-500/20 text-rose-400 p-2.5 rounded-2xl rounded-tl-xs border border-rose-500/30 text-xs">
            Gagal konek ke Groq API Bro: ${lastError}
          </div>
        `;
      }
      container.scrollTop = container.scrollHeight;
    }

    function selectCategoryShortcut(catId) {
      const catInput = document.getElementById('inp-category');

      document.querySelectorAll('.cat-shortcut-btn').forEach(btn => {
        btn.classList.remove('bg-sky-500', 'text-white', 'border-sky-500');
        btn.classList.add('tcc-inner');
      });
      const activeBtn = document.getElementById('btn-cat-' + catId);
      if (activeBtn) {
        activeBtn.classList.add('bg-sky-500', 'text-white', 'border-sky-500');
        activeBtn.classList.remove('tcc-inner');
      }

      const typeSelect = document.getElementById('inp-type');
      if (!typeSelect) return;
      const filtered = (DB.violationTypes || []).filter(t => t.category_id === catId && t.status === 'ACTIVE');
      typeSelect.innerHTML = '<option value="">-- Pilih Jenis Pelanggaran --</option>' +
        filtered.map(t => `<option value="${t.type_id}" class="bg-[#0B132B] text-white">[${t.level}] ${t.type_name}</option>`).join('');
      typeSelect.disabled = false;
      typeSelect.focus();
    }

    function setupKeyboardShortcuts() {
      window.onkeydown = function(e) {
        if (currentTab !== 'input-violation') return;
        if (e.altKey && e.key.toLowerCase() === 'n') {
          e.preventDefault();
          document.getElementById('student-search-input')?.focus();
        }
        if (e.altKey && e.key.toLowerCase() === 'j') {
          e.preventDefault();
          document.getElementById('inp-type')?.focus();
        }
        if (e.altKey && e.key.toLowerCase() === 'k') {
          e.preventDefault();
          document.getElementById('inp-desc')?.focus();
        }
        if (['1','2','3','4'].includes(e.key) && !['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) {
          e.preventDefault();
          const catMap = { '1': 'CAT-ATT', '2': 'CAT-CMP', '3': 'CAT-MUH', '4': 'CAT-OTH' };
          selectCategoryShortcut(catMap[e.key]);
        }
      };
    }

    function handleStudentSearch(q) {
      const resContainer = document.getElementById('student-search-results');
      if (!resContainer) return;
      if (!q || q.length < 2) {
        resContainer.classList.add('hidden');
        return;
      }
      const matches = (DB.students || []).filter(s => 
        s.name.toLowerCase().includes(q.toLowerCase()) || 
        s.student_id.toLowerCase().includes(q.toLowerCase())
      ).slice(0, 10);

      if (matches.length === 0) {
        resContainer.innerHTML = `<div class="p-3 text-xs text-slate-400 text-center">Santri tidak ditemukan.</div>`;
      } else {
        resContainer.innerHTML = matches.map(s => `
          <div onclick="selectStudentForForm('${s.student_id}')" class="p-3 hover:bg-sky-500/10 cursor-pointer flex justify-between items-center text-xs transition">
            <div>
              <span class="font-bold text-slate-900 dark:text-white">${s.name}</span>

              <div class="text-[10px] text-slate-400 mt-0.5">${s.room} • ${s.gurfah}</div>

            <span class="px-2 py-0.5 bg-sky-500/20 text-sky-500 border border-sky-500/30 font-bold rounded-full text-[10px]">Kelas ${s.class}</span>
          </div>
        `).join('');
      }
      resContainer.classList.remove('hidden');
    }

    function setSantriStatus(studentId, status) {
      currentAttendanceBatch[studentId] = status;
      ['CHECKED', 'LATE', 'ABSENT'].forEach(st => {
        const btn = document.getElementById(`btn-${studentId}-${st}`);
        if (!btn) return;
        btn.className = 'mc-btn px-3 py-1.5 rounded-lg text-xs font-bold text-slate-400 hover:bg-sky-500/20 transition';
      });

      const activeBtn = document.getElementById(`btn-${studentId}-${status}`);
      if (!activeBtn) return;
      if (status === 'CHECKED') activeBtn.className = 'mc-btn px-3 py-1.5 rounded-lg text-xs font-bold bg-emerald-500 text-white transition';
      if (status === 'LATE') activeBtn.className = 'mc-btn px-3 py-1.5 rounded-lg text-xs font-bold bg-amber-500 text-white transition';
      if (status === 'ABSENT') activeBtn.className = 'mc-btn px-3 py-1.5 rounded-lg text-xs font-bold bg-rose-500 text-white transition';

    function saveMorningCheckBatch() {
      const date = document.getElementById('mc-date-input')?.value || getTodayString();
      const autoViolation = document.getElementById('mc-auto-violation')?.checked;
      const officer = document.getElementById('mc-officer-select')?.value;

      for (let [studentId, status] of Object.entries(currentAttendanceBatch)) {
        DB.morningChecks.push({
          check_id: 'CHK-' + Date.now() + '-' + Math.floor(Math.random() * 1000),
          date: date,
          student_id: studentId,
          status: status,
          officer_id: officer,
          created_at: new Date().toISOString()
        });

        if (autoViolation && (status === 'ABSENT' || status === 'LATE')) {
          const typeId = status === 'ABSENT' ? 'TYP-ATT-02' : 'TYP-ATT-01';
          const desc = status === 'ABSENT' ? 'Tidak hadir pada absen pagi kamar' : 'Terlambat mengikuti absen pagi kamar';
          DB.violations.push({
            violation_id: 'VIO-' + Date.now() + '-' + Math.floor(Math.random() * 1000),
            date: date,
            time: '06:30',
            student_id: studentId,
            category_id: 'CAT-ATT',
            violation_type_id: typeId,
            description: desc,
            officer_id: officer,
            status: 'RECORDED',
            created_at: new Date().toISOString(),
            updated_at: new Date().toISOString()
          });
        }
      }

      saveDB();
      alert('Hasil pemeriksaan absen kamar berhasil disimpan ke database!');
      navigate('dashboard');

    function applyViolationFilters() {
      const tbody = document.getElementById('violations-table-body');
      if (!tbody) return;

      const q = (document.getElementById('vio-filter-search')?.value || '').toLowerCase().trim();
      const cat = document.getElementById('vio-filter-cat')?.value || 'ALL';
      const lvl = document.getElementById('vio-filter-level')?.value || 'ALL';
      const st = document.getElementById('vio-filter-status')?.value || 'ALL';

      let list = (DB.violations || []).filter(v => v.status !== 'DELETED');

      if (q) {
        list = list.filter(v => {
          const s = DB.students.find(item => item.student_id === v.student_id) || { name: '', student_id: '' };
          return s.name.toLowerCase().includes(q) || s.student_id.toLowerCase().includes(q);
        });
      }

      if (cat !== 'ALL') {
        list = list.filter(v => v.category_id === cat);
      }

      if (lvl !== 'ALL') {
        list = list.filter(v => {
          const typ = (DB.violationTypes || []).find(t => t.type_id === v.violation_type_id);
          return typ && typ.level === lvl;
        });
      }

      if (st !== 'ALL') {
        list = list.filter(v => v.status === st);
      }

      if (list.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="9" class="p-12 text-center text-slate-400">
              <i data-lucide="file-question" class="w-8 h-8 mx-auto mb-2 opacity-40"></i>
              <span>Tidak ada catatan pelanggaran yang sesuai filter.</span>
            </td>
          </tr>
        `;
        safeCreateIcons();
        return;
      }

      tbody.innerHTML = list.slice().reverse().map((v, idx) => {
        const student = DB.students.find(s => s.student_id === v.student_id) || { name: v.student_id, class: '-', room: '-' };
        const typ = (DB.violationTypes || []).find(t => t.type_id === v.violation_type_id) || { type_name: 'Pelanggaran Tidak Terdefinisi', level: 'RINGAN' };

        return `
          <tr class="hover:bg-sky-500/5 transition">
            <td class="p-4 text-center text-slate-400 font-bold">${idx + 1}</td>
            <td class="p-4 text-slate-400 font-medium">${v.date} <span class="text-[10px] block opacity-75">${v.time || ''}</span></td>
            <td class="p-4">
              <span class="font-bold text-slate-900 dark:text-white block cursor-pointer hover:text-sky-400" onclick="openStudentDossier('${student.student_id}')">${student.name}</span>
              <span class="text-[10px] text-slate-400 font-mono">${student.student_id}</span>
            </td>
            <td class="p-4 text-slate-400 font-medium">${student.class} • ${student.room}</td>
            <td class="p-4">
              <span class="px-2.5 py-0.5 rounded-full text-[9px] font-extrabold ${
                typ.level === 'BERAT' ? 'bg-rose-500/20 text-rose-500 border border-rose-500/30' :
                typ.level === 'SEDANG' ? 'bg-orange-500/20 text-orange-500 border border-orange-500/30' :
                'bg-amber-500/20 text-amber-500 border border-amber-500/30'
              }">${typ.level}</span>
            </td>
            <td class="p-4 font-semibold text-slate-800 dark:text-slate-200">
              ${typ.type_name}
              ${v.description ? `<p class="text-[10px] text-slate-400 mt-0.5 italic">"${v.description}"</p>` : ''}
            </td>
            <td class="p-4 text-slate-400 font-medium">${v.officer_id || '-'}</td>
            <td class="p-4">
              <span class="px-2 py-0.5 rounded-full text-[9px] font-bold ${
                v.status === 'VERIFIED' ? 'bg-emerald-500/20 text-emerald-500 border border-emerald-500/30' :
                v.status === 'RESOLVED' ? 'bg-blue-500/20 text-blue-500 border border-blue-500/30' :
                'bg-amber-500/20 text-amber-500 border border-amber-500/30'

            <td class="p-4 text-center">

    function renderReports(container) {
      const allV = (DB.violations || []).filter(v => v.status !== 'DELETED');
      const vTypes = DB.violationTypes || [];

    async function copyJsonBackup() {
      const area = document.getElementById('json-export-area');
      if (!area) return;
      area.select();
      try {
        await navigator.clipboard.writeText(area.value);
        alert('Kode JSON berhasil disalin ke clipboard!');
      } catch (e) {
        alert('Gagal menyalin otomatis, silakan blok dan salin manual.');
      }
    }

    function executeJsonImport(mode) {
      const raw = document.getElementById('json-import-area')?.value.trim();
      if (!raw) {
        alert('Peringatan: Kolom JSON import masih kosong!');
        return;
      }
      try {
        const parsed = JSON.parse(raw);
        if (mode === 'replace') {
          DB.violations = parsed.violations || [];
          DB.morningChecks = parsed.morningChecks || [];
          DB.muhadorohChecks = parsed.muhadorohChecks || [];
          DB.letters = parsed.letters || [];
        } else {
          DB.violations = [...DB.violations, ...(parsed.violations || [])];
          DB.morningChecks = [...DB.morningChecks, ...(parsed.morningChecks || [])];
          DB.muhadorohChecks = [...DB.muhadorohChecks, ...(parsed.muhadorohChecks || [])];
          DB.letters = [...DB.letters, ...(parsed.letters || [])];
        }
        saveDB();
        alert('Data JSON berhasil di-import dan diperbarui!');
        navigate('dashboard');
      } catch (err) {
        alert('Format kode JSON tidak valid! Pastikan format sesuai.');
      }
    }

      Storage.set('GROQ_KEY', key);
      closeModal();
      alert('Groq API Key berhasil disimpan dan aktif!');
    }

    function openSyncModal() {
      showModal(`
        <div class="p-6 space-y-4 text-xs">
          <div class="border-b pb-3 border-slate-700/40">
            <h3 class="text-sm font-extrabold">Hubungkan Google Apps Script API</h3>
            <p class="text-slate-400 text-[11px] mt-0.5">Masukkan URL Web App deployment untuk sinkronisasi cloud real-time</p>
          </div>
          <div>
            <label class="block font-bold text-slate-400 mb-1">Web App Deployment URL</label>
            <input type="url" id="api-url-input" value="${DB.apiUrl}" placeholder="https://script.google.com/macros/s/.../exec" class="w-full tcc-inner border rounded-xl p-2.5 font-mono text-[11px] focus:outline-none focus:border-sky-500" />
          </div>
          <p class="text-[11px] text-slate-400 tcc-inner p-3 rounded-2xl border">
            Bila URL diisi, data akan disinkronkan langsung ke spreadsheet database Bagian Pengajaran ZIIS.
          </p>
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 tcc-inner font-bold rounded-xl text-slate-400">Batal</button>
            <button type="button" onclick="saveApiUrl()" class="px-4 py-2 bg-sky-500 text-white font-bold rounded-xl shadow-md">Simpan</button>
          </div>
        </div>
      `);
    }

    function saveApiUrl() {
      const url = document.getElementById('api-url-input')?.value.trim();
      DB.apiUrl = url;
      Storage.set('API_URL', url);
      closeModal();
      alert('Konfigurasi URL API berhasil disimpan.');
    }

    function handleGlobalHeaderSearch(q) {
      const res = document.getElementById('header-search-results');
      if (!res) return;
      if (!q || q.length < 2) {
        res.classList.add('hidden');
        return;
      }
      const matches = (DB.students || []).filter(s => 
        s.name.toLowerCase().includes(q.toLowerCase()) || 
        s.student_id.toLowerCase().includes(q.toLowerCase()) || 
        s.room.toLowerCase().includes(q.toLowerCase()) || 
        s.gurfah.toLowerCase().includes(q.toLowerCase())
      ).slice(0, 6);

      if (matches.length === 0) {
        res.innerHTML = `<div class="p-3 text-xs text-slate-400 text-center">Tidak ditemukan.</div>`;
      } else {
        res.innerHTML = matches.map(s => `
          <div onclick="openStudentDossier('${s.student_id}'); document.getElementById('header-search-results')?.classList.add('hidden');" class="p-2.5 hover:bg-sky-500/10 rounded-xl cursor-pointer flex justify-between items-center text-xs transition">
            <div>
              <span class="font-bold text-slate-900 dark:text-white">${s.name}</span>
              <div class="text-[10px] text-slate-400">${s.room} • ${s.gurfah}</div>
            </div>
            <span class="px-2 py-0.5 bg-sky-500/20 text-sky-500 border border-sky-500/30 font-bold rounded-full text-[10px]">Kelas ${s.class}</span>
          </div>
        `).join('');
      }
      res.classList.remove('hidden');
    }

    window.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        document.getElementById('global-search-header')?.focus();
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      applyTheme();
      initTopBarOfficer();
      navigate('dashboard');
    });
  </script>
</body>
</html>
