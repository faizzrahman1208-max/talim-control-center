  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
          colors: {
            rg: {
              cyan: '#1CB0F6',

              blue: '#0F52BA',
              navy: '#0A2540',
              orange: '#FF8A00',

              border: '#E3ECF6'

          }

      }
    }

    }

    .custom-scroll::-webkit-scrollbar-track { background: #EDF3F9; }

<body class="min-h-screen flex flex-col antialiased custom-scroll">

  <!-- TOP APP BAR ALA RUANGGURU -->
  <header class="bg-white border-b border-rg-border sticky top-0 z-30 shadow-xs">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <!-- Logo Brand -->
      <div class="flex items-center gap-3 cursor-pointer" onclick="navigate('dashboard')">

          <p class="text-[11px] text-slate-400 font-medium">Discipline Data & Monitoring System</p>
        </div>
      </div>

        <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3"></i>
        <input 
          type="text" 
          id="global-search-header" 
          oninput="handleGlobalHeaderSearch(this.value)"
          placeholder="Cari nama santri, kamar, gurfah..."

        />

            <i data-lucide="user" class="w-3.5 h-3.5"></i>
          </div>
          <div class="text-left">
            <select id="global-officer-select" onchange="changeGlobalOfficer(this.value)" class="text-xs font-bold text-slate-700 bg-transparent focus:outline-none cursor-pointer">

        </div>

    </div>

        <button onclick="navigate('dashboard')" id="nav-dashboard" class="nav-pill flex items-center gap-2 px-4 py-2 rounded-full text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition shrink-0">

          <span>Kategori Aturan</span>
        </button>

    </div>
  </header>

    /* =========================================================================
       3. STORAGE & STATE ENGINE
       ========================================================================= */
    const Storage = {
      get(key, fallback) {
        try {
          const item = localStorage.getItem('TCC_RG_V3_' + key);
          return item ? JSON.parse(item) : fallback;
        } catch {
          return fallback;
        }
      },
      set(key, val) {
        try {
          localStorage.setItem('TCC_RG_V3_' + key, JSON.stringify(val));
        } catch (e) {
          console.error("Storage Error", e);
        }
      }
    };

    let currentGlobalOfficer = Storage.get('ACTIVE_OFFICER', TALIM_OFFICERS[1]);

    let DB = {
      apiUrl: Storage.get('API_URL', ''),
      students: EMBEDDED_STUDENTS,
      categories: Storage.get('CATEGORIES', DEFAULT_CATEGORIES),
      violationTypes: Storage.get('VIOLATION_TYPES', DEFAULT_VIOLATION_TYPES),
      violations: Storage.get('VIOLATIONS', []),
      morningChecks: Storage.get('MORNING_CHECKS', []),
      muhadorohChecks: Storage.get('MUHADOROH_CHECKS', []),
      letters: Storage.get('LETTERS', [])
    };

    function saveDB() {
      Storage.set('CATEGORIES', DB.categories);
      Storage.set('VIOLATION_TYPES', DB.violationTypes);
      Storage.set('VIOLATIONS', DB.violations);
      Storage.set('MORNING_CHECKS', DB.morningChecks);
      Storage.set('MUHADOROH_CHECKS', DB.muhadorohChecks);
      Storage.set('LETTERS', DB.letters);
    }

    function initTopBarOfficer() {
      const sel = document.getElementById('global-officer-select');
      if (!sel) return;
      sel.innerHTML = TALIM_OFFICERS.map(name => `
        <option value="${name}" ${name === currentGlobalOfficer ? 'selected' : ''}>${name}</option>
      `).join('');
    }

    function changeGlobalOfficer(name) {
      currentGlobalOfficer = name;
      Storage.set('ACTIVE_OFFICER', name);
      if (currentTab === 'input-violation') {
        const inp = document.getElementById('inp-officer');
        if (inp) inp.value = name;
      }
    }

    /* =========================================================================
       4. ROUTER NAVIGASI
       ========================================================================= */
    let currentTab = 'dashboard';

    function navigate(tabId) {
      currentTab = tabId;
      document.querySelectorAll('.nav-pill').forEach(btn => {
        btn.classList.remove('bg-sky-500', 'text-white', 'shadow-sm');
        btn.classList.add('text-slate-600');
        const icon = btn.querySelector('i');
        if (icon) icon.classList.remove('text-white');
      });
      const activeBtn = document.getElementById('nav-' + tabId);
      if (activeBtn) {
        activeBtn.classList.add('bg-sky-500', 'text-white', 'shadow-sm');
        activeBtn.classList.remove('text-slate-600');
        const icon = activeBtn.querySelector('i');
        if (icon) icon.classList.add('text-white');
      }

      const container = document.getElementById('app-container');
      if (tabId === 'dashboard') renderDashboard(container);
      else if (tabId === 'input-violation') renderInputViolation(container);
      else if (tabId === 'morning-check') renderMorningCheck(container);
      else if (tabId === 'muhadoroh-check') renderMuhadorohCheck(container);
      else if (tabId === 'collaboration') renderCollaboration(container);
      else if (tabId === 'violations') renderDataViolations(container);
      else if (tabId === 'students') renderStudents(container);
      else if (tabId === 'reports') renderReports(container);
      else if (tabId === 'categories') renderCategories(container);

      lucide.createIcons();
    }

    function getGreeting() {
      const h = new Date().getHours();
      if (h >= 5 && h < 12) return 'Selamat Pagi';
      if (h >= 12 && h < 18) return 'Selamat Siang';
      return 'Selamat Malam';
    }

    function getTodayString() {
      return new Date().toISOString().split('T')[0];
    }

    /* =========================================================================
       5. DASHBOARD VIEW (GAYA RUANGGURU MODERN)
       ========================================================================= */
    function renderDashboard(container) {
      const today = getTodayString();
      const checkedTodayIds = new Set(DB.morningChecks.filter(c => c.date === today).map(c => c.student_id));
      const santriCheckedCount = checkedTodayIds.size;

      const todayViolations = DB.violations.filter(v => v.date === today && v.status !== 'DELETED');
      const totalViolationsToday = todayViolations.length;
      const attCount = todayViolations.filter(v => v.category_id === 'CAT-ATT').length;
      const cmpCount = todayViolations.filter(v => v.category_id === 'CAT-CMP').length;
      const muhCount = todayViolations.filter(v => v.category_id === 'CAT-MUH').length;

      const recentList = [...DB.violations].filter(v => v.status !== 'DELETED').reverse().slice(0, 6);

      container.innerHTML = `
        <!-- Hero Banner Gradient Ala Ruangguru -->
        <div class="rg-gradient rounded-3xl p-6 sm:p-8 text-white shadow-lg relative overflow-hidden">
          <div class="relative z-10 flex flex-col md:flex-row md:items-center justify-between gap-6">
            <div class="space-y-2">
              <div class="inline-flex items-center gap-2 bg-white/20 backdrop-blur-md px-3 py-1 rounded-full text-xs font-semibold">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>Sistem Monitoring Disiplin Aktif</span>
              </div>
              <h2 class="text-2xl sm:text-3xl font-extrabold tracking-tight">
                ${getGreeting()}, Bagian Pengajaran 👋
              </h2>
              <p class="text-white/90 text-sm max-w-xl">
                “Discipline data at your fingertips.” Kelola presensi kamar, inspeksi kelengkapan, serta muhadoroh santri dengan cepat dan rapi.
              </p>
            </div>

            <!-- Petugas Active Pill Card -->
            <div class="bg-white/10 backdrop-blur-md border border-white/20 p-4 rounded-2xl flex items-center gap-4 text-xs shrink-0">
              <div class="w-12 h-12 rounded-xl bg-white text-sky-600 flex items-center justify-center font-bold text-lg shadow-sm">
                <i data-lucide="user-check" class="w-6 h-6 text-sky-600"></i>

    function handleStudentSearch(q) {
      const resContainer = document.getElementById('student-search-results');
      if (!q || q.length < 2) {
        resContainer.classList.add('hidden');
        return;
      }
      const matches = DB.students.filter(s => 
        s.name.toLowerCase().includes(q.toLowerCase()) || 
        s.student_id.toLowerCase().includes(q.toLowerCase())
      ).slice(0, 10);

      if (matches.length === 0) {
        resContainer.innerHTML = `<div class="p-3 text-xs text-slate-400 text-center">Santri tidak ditemukan.</div>`;
      } else {
        resContainer.innerHTML = matches.map(s => `
          <div onclick="selectStudentForForm('${s.student_id}')" class="p-3 hover:bg-sky-50/60 cursor-pointer flex justify-between items-center text-xs transition">
            <div>
              <span class="font-bold text-slate-800">${s.name}</span>
              ${s.is_mudabbir ? '<span class="ml-1 text-[9px] bg-amber-100 text-amber-800 px-1 py-0.5 rounded font-extrabold">Mudabbir</span>' : ''}
              <div class="text-[10px] text-slate-400 mt-0.5">${s.room} • ${s.gurfah}</div>
            </div>
            <span class="px-2 py-0.5 bg-sky-100 text-sky-700 font-bold rounded-full text-[10px]">Kelas ${s.class}</span>
          </div>
        `).join('');
      }
      resContainer.classList.remove('hidden');
    }

    function selectStudentForForm(id) {
      const s = DB.students.find(item => item.student_id === id);
      if (!s) return;
      selectedStudentForInput = s;
      document.getElementById('student-search-input').value = `${s.name} (${s.student_id})`;
      document.getElementById('inp-class').value = `Kelas ${s.class}`;
      document.getElementById('inp-room').value = `${s.room} • ${s.gurfah}`;
      document.getElementById('student-search-results').classList.add('hidden');
    }

    function handleCategoryChange(catId) {
      const typeSelect = document.getElementById('inp-type');
      if (!catId) {
        typeSelect.innerHTML = '<option value="">-- Pilih Kategori Dulu --</option>';
        typeSelect.disabled = true;
        return;
      }
      const filtered = DB.violationTypes.filter(t => t.category_id === catId && t.status === 'ACTIVE');
      typeSelect.innerHTML = '<option value="">-- Pilih Jenis Pelanggaran --</option>' +
        filtered.map(t => `<option value="${t.type_id}">${t.type_name}</option>`).join('');
      typeSelect.disabled = false;
    }

    function handleSaveViolation(e) {
      e.preventDefault();
      const toast = document.getElementById('input-toast');

      if (!selectedStudentForInput) {
        toast.className = 'mb-6 p-4 rounded-2xl text-xs font-bold bg-rose-50 text-rose-800 border border-rose-200 block';
        toast.innerText = 'Peringatan: Harap pilih santri dari daftar autocomplete terlebih dahulu!';
        return;
      }

      const officerChosen = document.getElementById('inp-officer').value;
      const newRecord = {
        violation_id: 'VIO-' + Date.now(),
        date: document.getElementById('inp-date').value,
        time: document.getElementById('inp-time').value,
        student_id: selectedStudentForInput.student_id,
        category_id: document.getElementById('inp-category').value,
        violation_type_id: document.getElementById('inp-type').value,
        description: document.getElementById('inp-desc').value,
        officer_id: officerChosen,
        status: document.getElementById('inp-status').value,
        created_at: new Date().toISOString(),
        updated_at: new Date().toISOString()
      };

      DB.violations.push(newRecord);
      saveDB();

      toast.className = 'mb-6 p-4 rounded-2xl text-xs font-bold bg-emerald-50 text-emerald-800 border border-emerald-200 block';
      toast.innerText = 'Pelanggaran santri berhasil dicatat dan disimpan ke database.';

      selectedStudentForInput = null;
      document.getElementById('student-search-input').value = '';
      document.getElementById('inp-class').value = '— Pilih santri di atas —';
      document.getElementById('inp-room').value = '—';
      document.getElementById('inp-desc').value = '';
      document.getElementById('inp-category').value = '';
      document.getElementById('inp-type').innerHTML = '<option value="">-- Pilih Kategori Dulu --</option>';
      document.getElementById('inp-type').disabled = true;
      document.getElementById('student-search-input').focus();
    }

    function setSantriStatus(studentId, status) {
      currentAttendanceBatch[studentId] = status;
      ['CHECKED', 'LATE', 'ABSENT'].forEach(st => {
        const btn = document.getElementById(`btn-${studentId}-${st}`);
        if (!btn) return;
        btn.className = 'mc-btn px-3 py-1.5 rounded-lg text-xs font-bold text-slate-600 hover:bg-slate-200 transition';
      });

      const activeBtn = document.getElementById(`btn-${studentId}-${status}`);
      if (status === 'CHECKED') activeBtn.className = 'mc-btn px-3 py-1.5 rounded-lg text-xs font-bold bg-emerald-500 text-white transition';
      if (status === 'LATE') activeBtn.className = 'mc-btn px-3 py-1.5 rounded-lg text-xs font-bold bg-amber-500 text-white transition';
      if (status === 'ABSENT') activeBtn.className = 'mc-btn px-3 py-1.5 rounded-lg text-xs font-bold bg-rose-500 text-white transition';
    }

    function saveMorningCheckBatch() {
      const date = document.getElementById('mc-date-input').value;
      const autoViolation = document.getElementById('mc-auto-violation').checked;
      const officer = document.getElementById('mc-officer-select').value;

      for (let [studentId, status] of Object.entries(currentAttendanceBatch)) {
        DB.morningChecks.push({
          check_id: 'CHK-' + Date.now() + '-' + Math.floor(Math.random() * 1000),
          date: date,
          student_id: studentId,
          status: status,
          officer_id: officer,
          created_at: new Date().toISOString()
        });

        if (autoViolation && (status === 'ABSENT' || status === 'LATE')) {
          const typeId = status === 'ABSENT' ? 'TYP-ATT-01' : 'TYP-ATT-02';
          const desc = status === 'ABSENT' ? 'Tidak hadir pada absen pagi kamar' : 'Terlambat mengikuti absen pagi kamar';
          DB.violations.push({
            violation_id: 'VIO-' + Date.now() + '-' + Math.floor(Math.random() * 1000),
            date: date,
            time: '06:30',
            student_id: studentId,
            category_id: 'CAT-ATT',
            violation_type_id: typeId,
            description: desc,
            officer_id: officer,
            status: 'RECORDED',
            created_at: new Date().toISOString(),
            updated_at: new Date().toISOString()
          });
        }
      }

      saveDB();
      alert('Hasil pemeriksaan absen kamar berhasil disimpan ke database!');
      navigate('dashboard');
    }

    function applyViolationFilters() {
      const q = document.getElementById('filter-query')?.value.toLowerCase() || '';
      const cat = document.getElementById('filter-category')?.value || '';
      const cls = document.getElementById('filter-class')?.value || '';
      const st = document.getElementById('filter-status')?.value || '';
      const dStart = document.getElementById('filter-start')?.value || '';
      const dEnd = document.getElementById('filter-end')?.value || '';

      const filtered = DB.violations.filter(v => {
        if (v.status === 'DELETED') return false;
        const student = DB.students.find(s => s.student_id === v.student_id) || { name: '', class: '' };
        const typ = DB.violationTypes.find(t => t.type_id === v.violation_type_id) || { type_name: '' };

        if (cat && v.category_id !== cat) return false;
        if (cls && student.class !== cls) return false;
        if (st && v.status !== st) return false;
        if (dStart && v.date < dStart) return false;
        if (dEnd && v.date > dEnd) return false;

        if (q) {
          const matchName = student.name.toLowerCase().includes(q);
          const matchId = v.violation_id.toLowerCase().includes(q) || v.student_id.toLowerCase().includes(q);
          const matchType = typ.type_name.toLowerCase().includes(q);
          const matchDesc = (v.description || '').toLowerCase().includes(q);
          if (!matchName && !matchId && !matchType && !matchDesc) return false;
        }
        return true;
      }).reverse();

      const tbody = document.getElementById('violations-table-body');
      if (!tbody) return;

      if (filtered.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="10" class="p-12 text-center text-slate-400">
              <i data-lucide="folder-x" class="w-8 h-8 mx-auto mb-2 opacity-40"></i>
              <span>Tidak ada data pelanggaran yang cocok dengan filter.</span>
            </td>
          </tr>
        `;
        lucide.createIcons();
        return;
      }

      tbody.innerHTML = filtered.map((v, idx) => {
        const student = DB.students.find(s => s.student_id === v.student_id) || { name: v.student_id, class: '-' };
        const catObj = DB.categories.find(c => c.category_id === v.category_id) || { category_name: '-' };
        const typObj = DB.violationTypes.find(t => t.type_id === v.violation_type_id) || { type_name: '-' };
        return `
          <tr class="hover:bg-slate-50/80 transition">
            <td class="p-4 text-center text-slate-400 font-bold">${idx + 1}</td>
            <td class="p-4 font-mono text-[10px] text-slate-400">${v.violation_id}</td>
            <td class="p-4 font-medium">${v.date}</td>
            <td class="p-4 font-bold text-slate-900">${student.name}</td>
            <td class="p-4 font-semibold text-slate-600">${student.class}</td>
            <td class="p-4"><span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-sky-50 text-sky-700">${catObj.category_name.split('/')[0]}</span></td>
            <td class="p-4 text-slate-700 font-medium">${typObj.type_name}</td>
            <td class="p-4 text-slate-600 font-semibold">${v.officer_id}</td>
            <td class="p-4">
              <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold ${
                v.status === 'VERIFIED' ? 'bg-sky-100 text-sky-800' :
                v.status === 'RESOLVED' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'
              }">${v.status}</span>
            </td>
            <td class="p-4 text-center">
              <div class="inline-flex gap-1">
                <button onclick="openViolationDetail('${v.violation_id}')" class="p-1.5 hover:bg-slate-200 rounded-lg text-slate-500 transition" title="Detail"><i data-lucide="eye" class="w-3.5 h-3.5"></i></button>
                <button onclick="confirmDeleteViolation('${v.violation_id}')" class="p-1.5 hover:bg-rose-100 rounded-lg text-rose-600 transition" title="Delete"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
              </div>
            </td>
          </tr>
        `;
      }).join('');

      lucide.createIcons();
    }

      const s = DB.students.find(item => item.student_id === studentId);

      const history = DB.violations.filter(v => v.student_id === studentId && v.status !== 'DELETED').reverse();

      const cmp = history.filter(v => v.category_id === 'CAT-CMP').length;
      const muh = history.filter(v => v.category_id === 'CAT-MUH').length;
      const oth = history.filter(v => v.category_id === 'CAT-OTH').length;

      showModal(`

              <h3 class="text-lg font-black text-slate-900">${s.name}</h3>

          </div>

          <div class="grid grid-cols-4 gap-2 text-center text-xs">
            <div class="p-3 bg-amber-50 border border-amber-100 rounded-2xl">
              <span class="block text-[10px] text-amber-700 font-bold uppercase">Attendance</span>
              <span class="text-lg font-bold text-amber-900">${att}</span>
            </div>
            <div class="p-3 bg-emerald-50 border border-emerald-100 rounded-2xl">
              <span class="block text-[10px] text-emerald-700 font-bold uppercase">Completeness</span>
              <span class="text-lg font-bold text-emerald-900">${cmp}</span>
            </div>
            <div class="p-3 bg-indigo-50 border border-indigo-100 rounded-2xl">
              <span class="block text-[10px] text-indigo-700 font-bold uppercase">Muhadoroh</span>
              <span class="text-lg font-bold text-indigo-900">${muh}</span>
            </div>
            <div class="p-3 bg-slate-100 rounded-2xl">
              <span class="block text-[10px] text-slate-600 font-bold uppercase">Others</span>
              <span class="text-lg font-bold text-slate-900">${oth}</span>
            </div>
          </div>

          <div>
            <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Riwayat Pelanggaran</h4>
            ${history.length === 0 ? `
              <p class="text-xs text-slate-400 italic bg-slate-50 p-4 rounded-2xl text-center">Belum ada catatan pelanggaran untuk santri ini.</p>
            ` : `
              <div class="max-h-48 overflow-y-auto divide-y divide-slate-100 border rounded-2xl text-xs">
                ${history.map(v => {
                  const typ = DB.violationTypes.find(t => t.type_id === v.violation_type_id) || { type_name: '-' };
                  return `
                    <div class="p-3 flex justify-between items-center hover:bg-slate-50 transition">
                      <div>
                        <div class="font-bold text-slate-800">${typ.type_name}</div>
                        <div class="text-[10px] text-slate-400">${v.date} ${v.time || ''} • Petugas: ${v.officer_id}</div>
                      </div>
                      <span class="text-[10px] px-2.5 py-0.5 rounded-full font-bold bg-slate-100 text-slate-700">${v.status}</span>
                    </div>
                  `;
                }).join('')}
              </div>
            `}
          </div>

          <div class="flex justify-end pt-2">
            <button onclick="closeModal()" class="px-5 py-2 bg-slate-100 hover:bg-slate-200 font-bold rounded-xl text-xs text-slate-700 transition">Tutup</button>
          </div>
        </div>
      `);
    }

    /* =========================================================================
       12. REPORTS VIEW
       ========================================================================= */
    function renderReports(container) {
      const activeViolations = DB.violations.filter(v => v.status !== 'DELETED');
      const total = activeViolations.length;

      const catCounts = {};
      DB.categories.forEach(c => {
        catCounts[c.category_id] = activeViolations.filter(v => v.category_id === c.category_id).length;
      });

      const classCounts = {};
      activeViolations.forEach(v => {
        const st = DB.students.find(s => s.student_id === v.student_id);
        const cls = st ? st.class : 'Lainnya';
        classCounts[cls] = (classCounts[cls] || 0) + 1;
      });

      container.innerHTML = `
        <div class="space-y-6">
          <div class="bg-white p-6 rounded-3xl border border-slate-200/80 shadow-xs flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
              <h2 class="text-xl font-extrabold text-slate-900">Rekapitulasi & Dukungan LPJ</h2>
              <p class="text-xs text-slate-400 mt-0.5">Satu klik untuk rekap tahunan, bulanan, dan ekspor data bersih ke format CSV</p>
            </div>
            <button onclick="exportViolationsToCSV()" class="py-2.5 px-5 bg-emerald-500 hover:bg-emerald-600 text-white font-bold rounded-xl text-xs shadow-md flex items-center gap-2 transition">
              <i data-lucide="download" class="w-4 h-4"></i>
              <span>Ekspor Data ke CSV</span>
            </button>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-white p-6 rounded-3xl border border-slate-200/80 shadow-xs">
              <span class="text-xs font-bold text-slate-400 uppercase">TOTAL PELANGGARAN AKTIF</span>
              <div class="text-4xl font-black text-slate-900 mt-2">${total}</div>
              <p class="text-xs text-slate-400 mt-1">Data kumulatif tahun berjalan</p>
            </div>
            <div class="bg-white p-6 rounded-3xl border border-slate-200/80 shadow-xs">
              <span class="text-xs font-bold text-slate-400 uppercase">SANTRI DENGAN PELANGGARAN</span>
              <div class="text-4xl font-black text-amber-500 mt-2">${new Set(activeViolations.map(v=>v.student_id)).size}</div>
              <p class="text-xs text-slate-400 mt-1">Santri dengan riwayat record</p>
            </div>
            <div class="bg-white p-6 rounded-3xl border border-slate-200/80 shadow-xs">
              <span class="text-xs font-bold text-slate-400 uppercase">TOTAL LOG PEMERIKSAAN</span>
              <div class="text-4xl font-black text-sky-500 mt-2">${DB.morningChecks.length + DB.muhadorohChecks.length}</div>
              <p class="text-xs text-slate-400 mt-1">Total log kamar & gurfah</p>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-white p-6 rounded-3xl border border-slate-200/80 shadow-xs">
              <h3 class="text-xs font-bold tracking-wider text-slate-400 uppercase mb-4">REKAP BERDASARKAN KATEGORI</h3>
              <div class="space-y-3">
                ${DB.categories.map(c => {
                  const cnt = catCounts[c.category_id] || 0;
                  const pct = total > 0 ? ((cnt / total) * 100).toFixed(1) : 0;
                  return `
                    <div>
                      <div class="flex justify-between text-xs font-bold mb-1">
                        <span class="text-slate-700">${c.category_name}</span>
                        <span class="text-slate-900">${cnt} record (${pct}%)</span>
                      </div>
                      <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                        <div class="bg-sky-500 h-full rounded-full" style="width: ${pct}%"></div>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>

            <div class="bg-white p-6 rounded-3xl border border-slate-200/80 shadow-xs">
              <h3 class="text-xs font-bold tracking-wider text-slate-400 uppercase mb-4">REKAP BERDASARKAN KELAS</h3>
              <div class="max-h-64 overflow-y-auto space-y-2 text-xs">
                ${Object.keys(classCounts).length === 0 ? `
                  <p class="text-slate-400 italic text-center py-8">Belum ada pelanggaran tercatat.</p>
                ` : Object.entries(classCounts).map(([cls, cnt]) => `
                  <div class="flex justify-between items-center p-3 bg-slate-50 rounded-2xl">
                    <span class="font-bold text-slate-700">Kelas ${cls}</span>
                    <span class="font-black text-slate-900">${cnt} record</span>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function exportViolationsToCSV() {
      const active = DB.violations.filter(v => v.status !== 'DELETED');
      if (active.length === 0) {
        alert('Tidak ada data pelanggaran aktif untuk diekspor!');
        return;
      }

      const headers = ['ID Pelanggaran', 'Tanggal', 'Waktu', 'Student ID', 'Nama Santri', 'Kelas', 'Kamar', 'Gurfah', 'Kategori', 'Jenis Pelanggaran', 'Keterangan', 'Petugas Ta\'lim', 'Status'];
      const rows = active.map(v => {
        const s = DB.students.find(item => item.student_id === v.student_id) || { name: '-', class: '-', room: '-', gurfah: '-' };
        const c = DB.categories.find(item => item.category_id === v.category_id) || { category_name: '-' };
        const t = DB.violationTypes.find(item => item.type_id === v.violation_type_id) || { type_name: '-' };
        return [
          v.violation_id,
          v.date,
          v.time || '',
          v.student_id,
          `"${s.name.replace(/"/g, '""')}"`,
          s.class,
          `"${s.room}"`,
          `"${s.gurfah}"`,
          `"${c.category_name.replace(/"/g, '""')}"`,
          `"${t.type_name.replace(/"/g, '""')}"`,
          `"${(v.description || '').replace(/"/g, '""')}"`,
          `"${v.officer_id.replace(/"/g, '""')}"`,
          v.status
        ].join(',');
      });

      const csvContent = [headers.join(','), ...rows].join('\r\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.setAttribute('download', `rekap_pelanggaran_talim_${getTodayString()}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    /* =========================================================================
       13. CATEGORIES VIEW
       ========================================================================= */
    function renderCategories(container) {
      container.innerHTML = `
        <div class="space-y-6">
          <div class="bg-white p-6 rounded-3xl border border-slate-200/80 shadow-xs flex justify-between items-center">
            <div>
              <h2 class="text-xl font-extrabold text-slate-900">Pengaturan Kategori & Jenis Aturan</h2>
              <p class="text-xs text-slate-400 mt-0.5">Admin dapat menyesuaikan jenis pelanggaran secara dinamis</p>
            </div>
            <button onclick="openAddTypeModal()" class="py-2.5 px-5 bg-sky-500 hover:bg-sky-600 text-white font-bold rounded-xl text-xs shadow-md flex items-center gap-1.5 transition">
              <i data-lucide="plus" class="w-4 h-4"></i>
              <span>Tambah Jenis Pelanggaran</span>
            </button>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            ${DB.categories.map(c => {
              const types = DB.violationTypes.filter(t => t.category_id === c.category_id);
              return `
                <div class="bg-white p-6 rounded-3xl border border-slate-200/80 shadow-xs">
                  <div class="flex justify-between items-center border-b border-slate-100 pb-3 mb-4">
                    <h3 class="text-sm font-extrabold text-slate-900">${c.category_name}</h3>
                    <span class="text-[10px] font-mono bg-slate-100 px-2 py-0.5 rounded-full text-slate-500">${c.category_id}</span>
                  </div>
                  <div class="space-y-2">
                    ${types.map(t => `
                      <div class="flex justify-between items-center p-3 bg-slate-50 rounded-2xl text-xs">
                        <span class="font-medium text-slate-800">${t.type_name}</span>
                        <span class="text-[10px] font-bold text-emerald-600">${t.status}</span>
                      </div>
                    `).join('')}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function openAddTypeModal() {
      showModal(`
        <div class="p-6 space-y-4 text-xs">
          <h3 class="text-sm font-extrabold text-slate-900">Tambah Jenis Pelanggaran Baru</h3>
          <form onsubmit="handleSaveType(event)" class="space-y-4">
            <div>
              <label class="block font-bold text-slate-600 mb-1">Pilih Kategori</label>
              <select id="modal-cat-id" required class="w-full bg-slate-50 border rounded-xl p-2.5">
                ${DB.categories.map(c => `<option value="${c.category_id}">${c.category_name}</option>`).join('')}
              </select>
            </div>
            <div>
              <label class="block font-bold text-slate-600 mb-1">Nama Jenis Pelanggaran</label>
              <input type="text" id="modal-type-name" required placeholder="Contoh: Terlambat mengumpulkan i'dad pidato" class="w-full bg-slate-50 border rounded-xl p-2.5" />
            </div>
            <div class="flex justify-end gap-2 pt-2">
              <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-100 font-bold rounded-xl">Batal</button>
              <button type="submit" class="px-4 py-2 bg-sky-500 text-white font-bold rounded-xl shadow-sm">Simpan</button>
            </div>
          </form>
        </div>
      `);
    }

    function handleSaveType(e) {
      e.preventDefault();
      const catId = document.getElementById('modal-cat-id').value;
      const typeName = document.getElementById('modal-type-name').value;

      DB.violationTypes.push({
        type_id: 'TYP-' + Date.now(),
        category_id: catId,
        type_name: typeName,
        status: 'ACTIVE'
      });
      saveDB();
      closeModal();
      navigate('categories');
    }

    /* =========================================================================
       14. MODAL & HEADER QUICK SEARCH
       ========================================================================= */
    function showModal(contentHtml) {
      const container = document.getElementById('modal-container');
      container.innerHTML = `
        <div class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
          <div class="bg-white rounded-3xl border border-slate-200 shadow-2xl max-w-lg w-full overflow-hidden animate-in fade-in zoom-in duration-150">
            ${contentHtml}
          </div>
        </div>
      `;
      lucide.createIcons();
    }

    function closeModal() {
      document.getElementById('modal-container').innerHTML = '';
    }

    function openSyncModal() {
      showModal(`
        <div class="p-6 space-y-4 text-xs">
          <div class="border-b pb-3">
            <h3 class="text-sm font-extrabold text-slate-900">Hubungkan Google Apps Script API</h3>
            <p class="text-slate-400 text-[11px] mt-0.5">Masukkan URL Web App deployment untuk sinkronisasi cloud real-time</p>
          </div>
          <div>
            <label class="block font-bold text-slate-600 mb-1">Web App Deployment URL</label>
            <input type="url" id="api-url-input" value="${DB.apiUrl}" placeholder="https://script.google.com/macros/s/.../exec" class="w-full bg-slate-50 border rounded-xl p-2.5 font-mono text-[11px]" />
          </div>
          <p class="text-[11px] text-slate-500 bg-sky-50 p-3 rounded-2xl border border-sky-100">
            Bila URL diisi, data akan disinkronkan langsung ke spreadsheet database Bagian Pengajaran ZIIS.
          </p>
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-100 font-bold rounded-xl">Batal</button>
            <button type="button" onclick="saveApiUrl()" class="px-4 py-2 bg-sky-500 text-white font-bold rounded-xl shadow-sm">Simpan</button>
          </div>
        </div>
      `);
    }

    function saveApiUrl() {
      const url = document.getElementById('api-url-input').value.trim();
      DB.apiUrl = url;
      Storage.set('API_URL', url);
      closeModal();
      alert('Konfigurasi URL API berhasil disimpan.');
    }

    function handleGlobalHeaderSearch(q) {
      const res = document.getElementById('header-search-results');
      if (!q || q.length < 2) {
        res.classList.add('hidden');
        return;
      }
      const matches = DB.students.filter(s => 
        s.name.toLowerCase().includes(q.toLowerCase()) || 
        s.student_id.toLowerCase().includes(q.toLowerCase()) ||
        s.room.toLowerCase().includes(q.toLowerCase()) ||
        s.gurfah.toLowerCase().includes(q.toLowerCase())
      ).slice(0, 6);

      if (matches.length === 0) {
        res.innerHTML = `<div class="p-3 text-xs text-slate-400 text-center">Tidak ditemukan.</div>`;
      } else {
        res.innerHTML = matches.map(s => `
          <div onclick="openStudentDossier('${s.student_id}'); document.getElementById('header-search-results').classList.add('hidden');" class="p-2.5 hover:bg-slate-50 rounded-xl cursor-pointer flex justify-between items-center text-xs">
            <div>
              <span class="font-bold text-slate-800">${s.name}</span>
              <div class="text-[10px] text-slate-400">${s.room} • ${s.gurfah}</div>
            </div>
            <span class="px-2 py-0.5 bg-sky-50 text-sky-600 font-bold rounded-full text-[10px]">Kelas ${s.class}</span>
          </div>
        `).join('');
      }
      res.classList.remove('hidden');
    }

    // Inisialisasi awal saat dokumen selesai dimuat
    window.addEventListener('DOMContentLoaded', () => {
      initTopBarOfficer();
      navigate('dashboard');
    });
  </script>
</body>
